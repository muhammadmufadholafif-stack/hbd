<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <!-- Rusty Brown Body Gradient -->
    <linearGradient id="rustPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C5B32"/>
      <stop offset="30%" stop-color="#7A4222"/>
      <stop offset="70%" stop-color="#5E3016"/>
      <stop offset="100%" stop-color="#42200D"/>
    </linearGradient>

    <!-- Faded Teal Paint Patches -->
    <linearGradient id="tealFaded" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E878C"/>
      <stop offset="60%" stop-color="#6DA5A8"/>
      <stop offset="100%" stop-color="#3D6E72"/>
    </linearGradient>

    <!-- Windshield / Eyes Gradient -->
    <linearGradient id="materWindshield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E5F3F7"/>
      <stop offset="100%" stop-color="#B8DCE8"/>
    </linearGradient>

    <!-- Tow Crane Steel -->
    <linearGradient id="craneSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="50%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>

    <!-- Tire Gradient -->
    <radialGradient id="materTireGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#444444"/>
      <stop offset="70%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="materShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#materShadow)">
    <!-- Shadow under truck -->
    <ellipse cx="250" cy="285" rx="210" ry="18" fill="#000000" opacity="0.35"/>

    <!-- TOW CRANE ASSEMBLY (A-Frame, Pulley, Cable, Hook) -->
    <!-- Boom Arms -->
    <line x1="160" y1="180" x2="60" y2="40" stroke="#333333" stroke-width="10" stroke-linecap="round"/>
    <line x1="180" y1="190" x2="60" y2="40" stroke="#555555" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="185" x2="60" y2="40" stroke="#444444" stroke-width="8" stroke-linecap="round"/>
    <!-- Cross struts -->
    <line x1="105" y1="100" x2="135" y2="135" stroke="#444444" stroke-width="5"/>
    <line x1="80" y1="70" x2="110" y2="95" stroke="#444444" stroke-width="5"/>
    <!-- Pulley wheel at top -->
    <circle cx="60" cy="40" r="14" fill="#222222" stroke="#666666" stroke-width="3"/>
    <circle cx="60" cy="40" r="4" fill="#AAAAAA"/>
    <!-- Cable dropping down -->
    <line x1="50" y1="42" x2="30" y2="160" stroke="#111111" stroke-width="3.5"/>
    <!-- Tow Hook -->
    <path d="M 30 160 C 25 175, 15 185, 30 195 C 45 205, 55 185, 45 175" fill="none" stroke="#222222" stroke-width="7" stroke-linecap="round"/>

    <!-- TRUCK BED (Rear) -->
    <path d="M 80 180 L 210 180 L 210 255 L 75 255 Z" fill="url(#rustPaint)" stroke="#3D210F" stroke-width="2"/>
    <!-- Bed Wooden/Metal Slats -->
    <line x1="80" y1="205" x2="210" y2="205" stroke="#42200D" stroke-width="3"/>
    <line x1="80" y1="230" x2="210" y2="230" stroke="#42200D" stroke-width="3"/>

    <!-- CABIN MAIN BODY -->
    <path d="M 200 255 
             L 200 130 
             C 200 120, 210 105, 230 100 
             L 320 95 
             C 345 95, 355 110, 360 130 
             L 370 170 
             L 450 175 
             C 465 178, 475 195, 475 220 
             C 475 255, 450 265, 430 265 
             C 415 225, 355 225, 340 265 
             L 190 265 
             C 175 225, 115 225, 100 265 
             L 75 265 
             L 80 180 Z" 
          fill="url(#rustPaint)" stroke="#3D210F" stroke-width="2.5"/>

    <!-- Faded Teal Patches (Original Mater Color showing through rust) -->
    <path d="M 215 130 C 215 115, 235 105, 260 105 L 290 105 C 270 120, 240 135, 215 130 Z" fill="url(#tealFaded)" opacity="0.6"/>
    <path d="M 370 185 C 390 180, 420 182, 440 190 C 430 205, 390 210, 370 185 Z" fill="url(#tealFaded)" opacity="0.5"/>

    <!-- WINDSHIELD & CABIN GLASS -->
    <!-- Windshield outline -->
    <path d="M 285 102 
             C 320 100, 345 112, 355 132 
             L 295 135 
             C 290 120, 285 110, 285 102 Z" 
          fill="url(#materWindshield)" stroke="#557788" stroke-width="2"/>

    <!-- Mater's Eyelids (Greenish Brown) -->
    <path d="M 285 102 C 315 100, 340 110, 355 125 C 335 115, 305 108, 285 102 Z" fill="#6A4528"/>

    <!-- Mater's Friendly Goofy Eyes (Hazel/Greenish-Brown) -->
    <!-- Left Eye -->
    <ellipse cx="312" cy="120" rx="9" ry="11" fill="#4B6E40"/>
    <ellipse cx="312" cy="120" rx="5" ry="6.5" fill="#111111"/>
    <circle cx="314" cy="117" r="2.5" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="340" cy="123" rx="8" ry="10" fill="#4B6E40"/>
    <ellipse cx="340" cy="123" rx="4.5" ry="6" fill="#111111"/>
    <circle cx="342" cy="120" r="2.2" fill="#FFFFFF"/>

    <!-- Side Door & Window -->
    <path d="M 215 135 C 230 115, 260 108, 280 108 L 285 138 L 225 138 Z" fill="#1B262C" opacity="0.8"/>
    <!-- Door Outline -->
    <path d="M 210 138 L 210 240 L 295 240 L 295 138 Z" fill="none" stroke="#2E1709" stroke-width="2"/>
    <!-- Door Towing Emblem "Tow-Mater Towing & Salvage" -->
    <circle cx="252" cy="188" r="20" fill="#E8D5B5" stroke="#7A4222" stroke-width="1.5" opacity="0.85"/>
    <text x="252" y="184" font-family="sans-serif" font-size="5" font-weight="900" fill="#7A4222" text-anchor="middle">TOW MATER</text>
    <text x="252" y="192" font-family="sans-serif" font-size="4" font-weight="bold" fill="#333333" text-anchor="middle">RADIATOR SPRINGS</text>

    <!-- Single Working Headlight (Left) & Missing Socket (Right) -->
    <!-- Left Headlight (with glass lens) -->
    <ellipse cx="445" cy="195" rx="10" ry="14" fill="#FFFBE6" stroke="#AAAAAA" stroke-width="2"/>
    <ellipse cx="443" cy="195" rx="7" ry="10" fill="#FFFFCC"/>
    <!-- Right Headlight (Missing / empty rusty bucket with dangling wire) -->
    <ellipse cx="400" cy="192" rx="9" ry="12" fill="#22140A" stroke="#5A3015" stroke-width="2"/>
    <path d="M 400 196 Q 403 206 397 212" stroke="#111111" stroke-width="1.5" fill="none"/>

    <!-- MATER'S ICONIC MOUTH & BUCK TEETH -->
    <!-- Mouth opening -->
    <path d="M 410 225 C 440 225, 465 235, 455 248 C 435 258, 400 252, 395 240 Z" fill="#221108" stroke="#3D210F" stroke-width="2"/>
    <!-- Two Big Famous Buck Teeth (Left & Right protruding) -->
    <rect x="420" y="226" width="10" height="13" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
    <rect x="433" y="227" width="10" height="13" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>

    <!-- WHEELS -->
    <!-- Front Wheel -->
    <g transform="translate(378, 252)">
      <circle cx="0" cy="0" r="34" fill="url(#materTireGrad)"/>
      <circle cx="0" cy="0" r="28" fill="#1E1E1E"/>
      <!-- Rusty steel rim -->
      <circle cx="0" cy="0" r="18" fill="#7A4222" stroke="#42200D" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#333333"/>
      <!-- Lug nuts -->
      <circle cx="-10" cy="0" r="2" fill="#CCCCCC"/>
      <circle cx="10" cy="0" r="2" fill="#CCCCCC"/>
      <circle cx="0" cy="-10" r="2" fill="#CCCCCC"/>
      <circle cx="0" cy="10" r="2" fill="#CCCCCC"/>
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(145, 252)">
      <circle cx="0" cy="0" r="35" fill="url(#materTireGrad)"/>
      <circle cx="0" cy="0" r="29" fill="#1E1E1E"/>
      <!-- Rusty steel rim -->
      <circle cx="0" cy="0" r="19" fill="#7A4222" stroke="#42200D" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#333333"/>
      <!-- Lug nuts -->
      <circle cx="-11" cy="0" r="2" fill="#CCCCCC"/>
      <circle cx="11" cy="0" r="2" fill="#CCCCCC"/>
      <circle cx="0" cy="-11" r="2" fill="#CCCCCC"/>
      <circle cx="0" cy="11" r="2" fill="#CCCCCC"/>
    </g>

    <!-- Rust Patches & Character details -->
    <circle cx="370" cy="220" r="4" fill="#381704" opacity="0.6"/>
    <circle cx="440" cy="215" r="3" fill="#381704" opacity="0.6"/>
    <circle cx="230" cy="220" r="5" fill="#381704" opacity="0.6"/>
    <circle cx="170" cy="210" r="6" fill="#381704" opacity="0.5"/>
  </g>
</svg>
